<svg id="svg-student" class="flowchart-svg" width="1040" height="590" viewBox="20 100 1040 590" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Inter', Arial, sans-serif;">

          <!-- Markers for Arrowheads -->
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f172a" />
            </marker>
          </defs>

          <!-- ==================== COLUMN 1 ==================== -->
          <!-- Start -->
          <rect x="75" y="130" width="140" height="42" rx="21" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="145" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Start</text>

          <line x1="145" y1="172" x2="145" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Sign Up -->
          <rect x="65" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="145" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Sign Up</text>
          <text x="145" y="247" text-anchor="middle" font-size="10" fill="#475569">(Student Number &amp; Info)</text>

          <line x1="145" y1="258" x2="145" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Verify OTP -->
          <rect x="65" y="295" width="160" height="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="145" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Verify Email OTP</text>

          <line x1="145" y1="340" x2="145" y2="375" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Login -->
          <rect x="65" y="375" width="160" height="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="145" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Login to Student Portal</text>

          <line x1="145" y1="420" x2="145" y2="465" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Connector B Out -->
          <circle cx="145" cy="485" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="145" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">B</text>

          <!-- ==================== COLUMN 2 ==================== -->
          <!-- Connector B In -->
          <circle cx="410" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">B</text>

          <line x1="410" y1="169" x2="410" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Dashboard -->
          <rect x="330" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Dashboard</text>
          <text x="410" y="247" text-anchor="middle" font-size="10" fill="#475569">(Status Overview &amp; Alerts)</text>

          <line x1="410" y1="258" x2="410" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- My Profile -->
          <rect x="330" y="295" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">My Profile</text>
          <text x="410" y="332" text-anchor="middle" font-size="10" fill="#475569">(Info, Map Pin &amp; Skills)</text>

          <line x1="410" y1="343" x2="410" y2="380" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- CMO Requirements -->
          <rect x="330" y="380" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">CMO Requirements</text>
          <text x="410" y="417" text-anchor="middle" font-size="10" fill="#475569">(Upload Waiver, Medical, ID)</text>

          <line x1="410" y1="428" x2="410" y2="465" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Decision Diamond -->
          <polygon points="410,465 490,505 410,545 330,505" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="499" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">Are documents</text>
          <text x="410" y="513" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">approved?</text>

          <!-- Decision No Path -->
          <line x1="410" y1="545" x2="410" y2="580" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="418" y="563" font-size="10" font-weight="700" fill="#0f172a">No</text>

          <rect x="335" y="580" width="150" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="598" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Update / Re-upload</text>
          <text x="410" y="612" text-anchor="middle" font-size="9.5" fill="#475569">Required Documents</text>

          <!-- Loop Back Arrow to CMO Requirements -->
          <path d="M 335 600 L 305 600 L 305 404 L 330 404" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Decision Yes Path -->
          <path d="M 490 505 L 515 505 L 515 658 L 430 658" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="495" y="497" font-size="10" font-weight="700" fill="#0f172a">Yes</text>

          <!-- Connector C Out -->
          <circle cx="410" cy="658" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="663" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">C</text>

          <!-- ==================== COLUMN 3 ==================== -->
          <!-- Connector C In -->
          <circle cx="670" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="670" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">C</text>

          <line x1="670" y1="169" x2="670" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Wait for DSS Matching -->
          <rect x="590" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Wait for DSS</text>
          <text x="670" y="247" text-anchor="middle" font-size="10" fill="#475569">Auto-Matching</text>

          <line x1="670" y1="258" x2="670" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Deployment & Monitoring -->
          <rect x="590" y="295" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Deployment &amp; Monitoring</text>
          <text x="670" y="332" text-anchor="middle" font-size="10" fill="#475569">(View Site &amp; Schedule)</text>

          <line x1="670" y1="343" x2="670" y2="380" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Attend Fieldwork Activities -->
          <rect x="590" y="380" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Attend Community</text>
          <text x="670" y="417" text-anchor="middle" font-size="10" fill="#475569">Fieldwork Activities</text>

          <line x1="670" y1="428" x2="670" y2="465" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Official Logs Attendance -->
          <rect x="590" y="465" width="160" height="52" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="486" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Community Official</text>
          <text x="670" y="500" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Logs Attendance</text>
          <text x="670" y="513" text-anchor="middle" font-size="9" fill="#475569">(Time-In &amp; Time-Out)</text>

          <line x1="670" y1="517" x2="670" y2="550" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Monitor Hours -->
          <rect x="590" y="550" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="571" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Monitor Rendered Hours</text>
          <text x="670" y="587" text-anchor="middle" font-size="10" fill="#475569">&amp; Service Logs</text>

          <line x1="670" y1="598" x2="670" y2="640" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Connector D Out -->
          <circle cx="670" cy="658" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="670" y="663" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">D</text>

          <!-- ==================== COLUMN 4 ==================== -->
          <!-- Connector D In -->
          <circle cx="930" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="930" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">D</text>

          <line x1="930" y1="169" x2="930" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Feedback & Evaluation -->
          <rect x="850" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Feedback &amp; Evaluation</text>
          <text x="930" y="247" text-anchor="middle" font-size="10" fill="#475569">(Rate Site &amp; Supervisor)</text>

          <line x1="930" y1="258" x2="930" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Track Rendered Hours -->
          <rect x="850" y="295" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Track Rendered NOH</text>
          <text x="930" y="332" text-anchor="middle" font-size="10" fill="#475569">(Confirm 54 Hours Met)</text>

          <line x1="930" y1="343" x2="930" y2="380" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Edit Profile & Settings -->
          <rect x="850" y="380" width="160" height="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Edit Profile &amp;</text>
          <text x="930" y="415" text-anchor="middle" font-size="10" fill="#475569">Account Settings</text>

          <line x1="930" y1="425" x2="930" y2="460" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Change Password -->
          <rect x="850" y="460" width="160" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="485" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Change Password</text>

          <line x1="930" y1="500" x2="930" y2="535" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- Logout -->
          <rect x="850" y="535" width="160" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Logout</text>

          <line x1="930" y1="575" x2="930" y2="615" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <!-- End -->
          <rect x="860" y="615" width="140" height="42" rx="21" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="930" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">End</text>

        </svg>