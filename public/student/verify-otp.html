<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — CWTSConnect Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/student-auth.css?v=4" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <!-- Text-Based Branding -->
      <div class="brand">
        <div class="brand-text-logo">
          <span class="brand-name">CWTS</span><span class="brand-accent">Connect</span>
        </div>
        <p class="brand-subtitle">Check your institutional email for the 6-digit verification code.</p>
      </div>

      <h2 class="form-heading">Verify Your Email</h2>

      <!-- Alert Box -->
      <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

      <!-- OTP Verification Form -->
      <form id="otpForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="yourname@lspu.edu.ph"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="otp">Verification Code</label>
          <input
            class="form-input otp-input"
            type="text"
            id="otp"
            name="otp"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" id="verifyBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Verify Email</span>
        </button>

      </form>

      <!-- Resend OTP Section -->
      <div class="divider"><span>or</span></div>

      <div class="auth-secondary-action">
        <p class="auth-secondary-desc">
          Did not receive the code or code has expired?
        </p>
        <button class="btn btn-secondary" id="resendBtn" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Resend Code</span>
        </button>
        <p id="resendCooldown" class="auth-cooldown-text"></p>
      </div>

      <!-- Footer Links -->
      <div class="form-footer">
        <div class="form-footer-row">
          <a href="login.html">Back to Login</a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/verify-otp.js"></script>
</body>
</html>
