<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - NSTPConnect</title>
  <link rel="stylesheet" href="css/nstp-dashboard.css?v=2">
</head>
<body>
  <div class="dashboard-page">
    <!-- Top Navigation -->
    <nav class="topbar">
      <div class="topbar-brand">NSTPConnect</div>
      <div class="topbar-right">
        <span class="topbar-email" id="userEmail">Loading...</span>
        <button type="button" class="btn btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-content">
      <!-- Header Section -->
      <div class="dashboard-welcome">
        <h1>Student Profile Quick View</h1>
        <p>Detailed student information for matching assessment.</p>
        <div class="breadcrumb">
          <a href="dashboard.html">Dashboard</a> > 
          <a href="dss-matching.html">DSS Matching</a> > 
          Student Profile
        </div>
      </div>

      <!-- Student Profile Card -->
      <div class="profile-card" id="studentProfileCard">
        <div class="loading-spinner">Loading student profile...</div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons" id="actionButtons" style="display: none;">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; margin-right: 8px;">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back to Matching
        </button>
        <button type="button" class="btn btn-primary" id="selectForDeploymentBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; margin-right: 8px;">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Select for Deployment (Coming Soon)
        </button>
      </div>
    </main>
  </div>

  <script src="js/student-match-profile.js"></script>
</body>
</html>
