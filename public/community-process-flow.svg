<svg id="svg-partner" class="flowchart-svg" width="1040" height="540" viewBox="20 100 1040 540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Inter', Arial, sans-serif;">

          <!-- Column 1 -->
          <rect x="75" y="130" width="140" height="42" rx="21" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="145" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Start</text>

          <line x1="145" y1="172" x2="145" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="65" y="210" width="160" height="52" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="145" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Receive Official</text>
          <text x="145" y="247" text-anchor="middle" font-size="10" fill="#475569">Credentials from CWTS</text>

          <line x1="145" y1="262" x2="145" y2="305" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="65" y="305" width="160" height="45" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="145" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Login to Partner Portal</text>

          <line x1="145" y1="350" x2="145" y2="400" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <circle cx="145" cy="420" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="145" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">B</text>

          <!-- Column 2 (Main: Dashboard & Community Requests) -->
          <circle cx="410" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">B</text>

          <line x1="410" y1="169" x2="410" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="330" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Dashboard</text>
          <text x="410" y="247" text-anchor="middle" font-size="10" fill="#475569">(Metrics &amp; Overview)</text>

          <line x1="410" y1="258" x2="410" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="330" y="295" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Community Requests</text>
          <text x="410" y="332" text-anchor="middle" font-size="10" fill="#475569">(Create &amp; Submit Request)</text>

          <line x1="410" y1="343" x2="410" y2="385" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <polygon points="410,385 490,425 410,465 330,425" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="419" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">Is request</text>
          <text x="410" y="433" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">approved?</text>

          <line x1="410" y1="465" x2="410" y2="505" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="418" y="488" font-size="10" font-weight="700" fill="#0f172a">No</text>

          <rect x="335" y="505" width="150" height="40" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="410" y="523" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Revise Request Details</text>
          <text x="410" y="537" text-anchor="middle" font-size="9.5" fill="#475569">&amp; Resubmit</text>

          <path d="M 335 525 L 305 525 L 305 320 L 330 320" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <path d="M 490 425 L 515 425 L 515 600 L 430 600" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="495" y="417" font-size="10" font-weight="700" fill="#0f172a">Yes</text>

          <circle cx="410" cy="600" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="410" y="605" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">C</text>

          <!-- Column 3 (Monitoring: Deployments & Attendance) -->
          <circle cx="670" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="670" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">C</text>

          <line x1="670" y1="169" x2="670" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="590" y="210" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Deployment &amp; Monitoring</text>
          <text x="670" y="247" text-anchor="middle" font-size="10" fill="#475569">(View Student Roster)</text>

          <line x1="670" y1="258" x2="670" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="590" y="295" width="160" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Supervise On-site</text>
          <text x="670" y="332" text-anchor="middle" font-size="10" fill="#475569">Volunteer Activities</text>

          <line x1="670" y1="343" x2="670" y2="380" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="590" y="380" width="160" height="52" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="670" y="401" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Attendance &amp; Hours</text>
          <text x="670" y="417" text-anchor="middle" font-size="10" fill="#475569">(Log Time-In &amp; Time-Out)</text>

          <line x1="670" y1="432" x2="670" y2="480" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <circle cx="670" cy="500" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="670" y="505" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">D</text>

          <!-- Column 4 (Monitoring: Feedback & Completion) -->
          <circle cx="930" cy="151" r="18" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="930" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">D</text>

          <line x1="930" y1="169" x2="930" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="850" y="210" width="160" height="52" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Feedback &amp; Evaluation</text>
          <text x="930" y="247" text-anchor="middle" font-size="10" fill="#475569">(Rate Students &amp; Remarks)</text>

          <line x1="930" y1="262" x2="930" y2="305" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="850" y="305" width="160" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" rx="3" />
          <text x="930" y="331" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Logout (Sign Out)</text>

          <line x1="930" y1="347" x2="930" y2="390" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

          <rect x="860" y="390" width="140" height="42" rx="21" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
          <text x="930" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">End</text>
        </svg>