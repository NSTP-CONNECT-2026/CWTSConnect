<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWTSConnect Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css?v=7" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <!-- Text-Based Branding -->
      <div class="brand">
        <div class="brand-text-logo">
          <span class="brand-name">CWTS</span><span class="brand-accent">Connect</span>
        </div>
        <p class="brand-subtitle">Sign in to access your CWTSConnect account</p>
      </div>

      <h2 class="form-heading">Account Login</h2>

      <!-- Alert Box -->
      <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              data-target="password"
              title="Toggle password visibility"
              aria-label="Show password"
            >
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="form-helper-row-right">
            <a href="forgot-password.html" class="forgot-link">Forgot your password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Log In</span>
        </button>

      </form>

      <!-- Footer Links -->
      <div class="form-footer">
        <div class="form-footer-row">
          Student? <a href="student/signup.html">Create an account</a>
        </div>
        <div class="form-footer-row">
          Need to verify your email? <a href="student/verify-otp.html">Verify OTP</a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
